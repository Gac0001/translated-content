# SIG-DEP derrière Nginx (facultatif : le service unique suffit sur un réseau local).
# À employer si Nginx est déjà le point d’entrée HTTPS du serveur. Dans config/.env : TRUST_PROXY=1,
# APP_URL=https://sig-dep.dep.local, COOKIE_SECURE=true, et l’API écoute seulement en local (PORT=4000).
# Copier dans /etc/nginx/sites-available/, lier dans sites-enabled/, puis nginx -t && systemctl reload nginx.
server {
  listen 443 ssl http2;
  server_name sig-dep.dep.local;
  ssl_certificate     /etc/ssl/sig-dep/certificat.pem;
  ssl_certificate_key /etc/ssl/sig-dep/cle-privee.pem;
  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  server_name sig-dep.dep.local;
  return 301 https://$host$request_uri;
}
